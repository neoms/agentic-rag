services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 中设置 DASHSCOPE_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-qwen-turbo}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-qwen-max}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      RERANK_MODEL: ${RERANK_MODEL:-gte-rerank-v2}
      # 前端与后端同源（nginx 反代），无需跨域；保留默认白名单兜底
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - agentic_rag_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentic_rag_data:

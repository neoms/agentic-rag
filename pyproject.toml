[project]
name = "agentic-rag"
version = "0.1.0"
description = "基于 LangGraph 构建的智能检索增强生成（Agentic RAG）系统。支持多策略检索、自反思评估、工具调用、流式输出等高级能力。"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.26.4",
    "ddgs>=9.14.4",
    "fastapi>=0.139.2",
    "jieba>=0.42.1",
    "kuzu>=0.7.0,<1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.3.31,<0.4",
    "langchain-openai>=1.3.5",
    "langfuse>=4.14.2",
    "langgraph>=1.2.9",
    "langsmith>=0.10.6",
    "mistune>=3.3.4",
    "numpy>=1.26.0",
    "pdfminer-six>=20260107",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "locust>=2.46.3",
    "pytest>=9.1.1",
]
